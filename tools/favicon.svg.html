<!doctype html>
<!-- Renders favicon.svg to fill the window, for capturing the PNG fallbacks
     (apple-touch-icon.png, favicon-32.png). See "Preview card and icons" in
     the README. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  img { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <img src="../favicon.svg" alt="">
</body>
</html>
